name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEOPOL_ALLOWED_ORIGINS: http://127.0.0.1:5174
      GEOPOL_E2E_URL: http://127.0.0.1:5174
      GEOPOL_E2E_PYTHON: python
      GEOPOL_E2E_USER: synthetic-ci-reviewer
      GEOPOL_E2E_PASSWORD: synthetic-ci-only-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies from constraints
        run: python -m pip install -c backend/requirements.lock -e './backend[dev]'
      - name: Configure isolated storage paths
        shell: bash
        run: |
          printf 'GEOPOL_DATABASE_URL=sqlite:///%s/geopol-e2e.db\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GEOPOL_STORAGE_PATH=%s/geopol-e2e-storage\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Initialize isolated synthetic database
        run: |
          python -m geopol.cli init-db
          python -m geopol.cli create-user --username "$GEOPOL_E2E_USER" --role admin --password-env GEOPOL_E2E_PASSWORD
      - name: Run API, worker, frontend and browser scenario
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/geopol-e2e-logs"
          mkdir -p "$logs"
          python -m uvicorn geopol.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$logs/api.log" 2>&1 &
          api_pid=$!
          python -m geopol.worker > "$logs/worker.log" 2>&1 &
          worker_pid=$!
          node frontend/node_modules/vite/bin/vite.js frontend --host 127.0.0.1 --port 5174 --strictPort > "$logs/frontend.log" 2>&1 &
          frontend_pid=$!
          cleanup() {
            kill "$api_pid" "$worker_pid" "$frontend_pid" 2>/dev/null || true
            wait "$api_pid" "$worker_pid" "$frontend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            kill -0 "$api_pid" "$worker_pid" "$frontend_pid"
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null && curl --fail --silent "$GEOPOL_E2E_URL" > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "The isolated E2E services did not become healthy within 60 seconds."
            exit 1
          fi
          npm --prefix frontend run test:e2e
      - name: Preserve synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geopol-e2e-failure
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            frontend/playwright-report/
            frontend/test-results/
            .local/ui-*.png
            ${{ runner.temp }}/geopol-e2e-logs/

  postgis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: geopol_test
          POSTGRES_USER: geopol_test
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geopol_test -d geopol_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GEOPOL_TEST_DATABASE_URL: postgresql+psycopg://geopol_test:synthetic-ci-only-password@127.0.0.1:5432/geopol_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: python -m pytest tests/test_postgres.py -q

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Bash setup and failure handling
        run: |
          python -m pip install pytest
          python -m pytest scripts/tests/test_bash_compose.py -q
          for script in instalar.sh iniciar.sh detener.sh scripts/local-compose.sh; do bash -n "$script"; done
      - name: Install a fresh PostgreSQL instance and verify restart
        run: python scripts/tests/compose_smoke.py
      - name: Show service diagnostics on failure
        if: failure()
        run: |
          if [ -f .local/compose.env ]; then
            docker compose -p geopol-local --env-file .local/compose.env -f compose.yaml ps --all
            docker compose -p geopol-local --env-file .local/compose.env -f compose.yaml logs --tail 60
          fi
      - name: Remove only this job's synthetic containers and volumes
        if: always()
        run: |
          if [ -f .local/compose.env ]; then
            docker compose -p geopol-local --env-file .local/compose.env -f compose.yaml down --volumes
          fi

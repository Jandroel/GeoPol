name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEOPOL_ALLOWED_ORIGINS: http://127.0.0.1:5174
      GEOPOL_E2E_URL: http://127.0.0.1:5174
      GEOPOL_E2E_PYTHON: python
      GEOPOL_E2E_USER: synthetic-ci-reviewer
      GEOPOL_E2E_PASSWORD: synthetic-ci-only-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies from constraints
        run: python -m pip install -c backend/requirements.lock -e './backend[dev]'
      - name: Configure isolated storage paths
        shell: bash
        run: |
          printf 'GEOPOL_DATABASE_URL=sqlite:///%s/geopol-e2e.db\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GEOPOL_STORAGE_PATH=%s/geopol-e2e-storage\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Initialize isolated synthetic database
        run: |
          python -m geopol.cli init-db
          python -m geopol.cli create-user --username "$GEOPOL_E2E_USER" --role admin --password-env GEOPOL_E2E_PASSWORD
      - name: Run API, worker, frontend and browser scenario
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/geopol-e2e-logs"
          mkdir -p "$logs"
          python -m uvicorn geopol.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$logs/api.log" 2>&1 &
          api_pid=$!
          python -m geopol.worker > "$logs/worker.log" 2>&1 &
          worker_pid=$!
          node frontend/node_modules/vite/bin/vite.js frontend --host 127.0.0.1 --port 5174 --strictPort > "$logs/frontend.log" 2>&1 &
          frontend_pid=$!
          cleanup() {
            kill "$api_pid" "$worker_pid" "$frontend_pid" 2>/dev/null || true
            wait "$api_pid" "$worker_pid" "$frontend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            kill -0 "$api_pid" "$worker_pid" "$frontend_pid"
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null && curl --fail --silent "$GEOPOL_E2E_URL" > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "The isolated E2E services did not become healthy within 60 seconds."
            exit 1
          fi
          npm --prefix frontend run test:e2e
      - name: Preserve synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geopol-e2e-failure
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            frontend/playwright-report/
            frontend/test-results/
            .local/ui-*.png
            ${{ runner.temp }}/geopol-e2e-logs/

  native-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEOPOL_SETUP_PGHOST: 127.0.0.1
      GEOPOL_SETUP_PGPORT: '5432'
      GEOPOL_SETUP_PGDATABASE: geopol_native_ci
      GEOPOL_SETUP_PGUSER: postgres
      GEOPOL_SETUP_PGPASSWORD: synthetic-ci-only-password
      GEOPOL_TEST_DATABASE_URL: postgresql+psycopg://postgres:synthetic-ci-only-password@127.0.0.1:5432/geopol_test
      BROWSER: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PostgreSQL and PostGIS directly on Ubuntu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16 postgresql-contrib postgresql-16-postgis-3
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres PASSWORD 'synthetic-ci-only-password'"
          sudo -u postgres createdb geopol_test
      - name: Install from Bash and verify PostgreSQL, login and restart
        run: python scripts/tests/native_smoke.py
      - name: Validate migrations, native setup and process supervision
        run: |
          backend/.venv/bin/python -m pytest backend/tests/test_postgres.py scripts/tests -q
          for script in instalar.sh iniciar.sh detener.sh scripts/native.sh; do bash -n "$script"; done
      - name: Show native service diagnostics on failure
        if: failure()
        run: |
          find .local -maxdepth 2 -name '*.log' -exec tail -n 40 {} \; || true
      - name: Stop the application's own processes
        if: always()
        run: |
          if [ -f .local/native.json ]; then
            bash detener.sh
          fi

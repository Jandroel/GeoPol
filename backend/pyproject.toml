[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geopol-mvp"
version = "0.1.0"
description = "Procesamiento auditable de ubicaciones policiales"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0.36,<2.1", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1", "rapidfuzz>=3.12,<4", "shapely>=2.0.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]
references = ["osmium==4.3.1"]

[tool.setuptools.packages.find]
include = ["geopol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fa" />
    <script>
      (function () {
        var theme = "light";
        try {
          if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          )
            theme = "dark";
          var saved = localStorage.getItem("geopol.theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (_) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor =
          theme === "dark" ? "#0c1927" : "#f4f7fa";
      })();
    </script>
    <meta
      name="description"
      content="GeoPol · Espacio de trabajo para normalización, geocodificación y revisión trazable."
    />
    <title>GeoPol · Inteligencia territorial</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
